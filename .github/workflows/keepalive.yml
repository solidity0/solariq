# Calls the Supabase keep-alive function every 3 days so the free-plan
# database isn't paused for inactivity. Run it by hand from the Actions tab too.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://gqpgmrightdtwmksxejp.supabase.co
          SUPABASE_KEY: sb_publishable_O2hBOsQicGIJ0xeVivzHUg_NlmzPQrz
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo

      # GitHub turns off scheduled workflows after 60 days without commits;
      # re-enabling on each run helps keep this one on.
      - name: Keep this workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY" || true
